[package]
  cjc-version = "1.1.3"
  name = "ignetdiag"
  version = "0.1.0"
  output-type = "static"
  src-dir = "src"
  compile-option = "-Woff unused"
  license = "Apache-2.0"
  include = ["src", "README.md", "LICENSE", "NOTICE"]
  exclude = ["target", "build", "_helper", "scripts", "cangjie-repo.toml", "__pycache__", "*.pyc", "*.bak"]
  description = "Network diagnostics toolkit in pure Cangjie std: paced UDP throughput pairs with RFC 1889 jitter and loss accounting, TCP connects with caller budgets, host listing"
